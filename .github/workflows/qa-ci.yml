name: ZenTime QA CI

"on":
  pull_request:
  push:
    branches:
      - qa-testing

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:tc:mysql:8.0.36:///zentime_ci
      DB_USERNAME: test
      DB_PASSWORD: test
      PUSH_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x ./mvnw

      - name: Run backend unit and integration tests
        run: ./mvnw -B test

  admin-build:
    name: Admin Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build admin frontend
        env:
          CI: "false"
        run: npm run build

  mobile-check:
    name: Mobile TypeScript and Expo Config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile-app
    env:
      EXPO_PUBLIC_API_BASE_URL: http://localhost:5001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Validate Expo public config
        run: npx expo config --type public

  qa-gate:
    name: QA Gate
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - admin-build
      - mobile-check
    if: always()
    steps:
      - name: Check required QA jobs
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "backend-tests failed"
            exit 1
          fi
          if [ "${{ needs.admin-build.result }}" != "success" ]; then
            echo "admin-build failed"
            exit 1
          fi
          if [ "${{ needs.mobile-check.result }}" != "success" ]; then
            echo "mobile-check failed"
            exit 1
          fi
          echo "QA gate passed"
