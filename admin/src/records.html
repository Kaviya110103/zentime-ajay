<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parallax Day to Night Scroller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --day-sky: #B7F2FF;
      --sun-color: #FDCA48;
      --night-sky: #0b1736;
      --moon-color: #fffde7;
    }
    html, body {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      font-family: "Inter", Arial, sans-serif;
      overflow-x: hidden;
      background: var(--day-sky);
      transition: background 1s;
    }
    .container {
      position: relative;
      height: 400vh;
      width: 100vw;
    }
    .sky {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: linear-gradient(to bottom, var(--day-sky), #fff);
      transition: background 1.2s ease-in-out;
      z-index: 1;
    }
    .circle-svg {
      position: fixed;
      top: 8vh; left: 50%;
      transform: translateX(-50%);
      width: 500px; height: 280px;
      pointer-events: none;
      z-index: 2;
    }
    .circle-path {
      stroke: #fff; stroke-width: 2;
      opacity: 0.2;
    }
    .sun, .moon {
      opacity: 0;
      transition: opacity 0.5s ease;
      filter: drop-shadow(0 0 15px var(--sun-color));
      will-change: transform, opacity;
    }
    .moon {
      filter: drop-shadow(0 0 18px #fff);
    }
    .stars {
      position: fixed;
      top: 0; left: 0;
      height: 100vh; width: 100vw;
      pointer-events: none;
      z-index: 3;
    }
    .star {
      background: #fff;
      border-radius: 100%;
      height: 8px; width: 8px;
      position: absolute;
      opacity: 0;
      box-shadow: 0 0 6px 2px #fff;
      animation: twinkle 3s infinite ease-in-out alternate;
    }
    @keyframes twinkle {
      0% { opacity: 1; transform: scale(1);}
      50% { opacity: 0.5; transform: scale(0.8);}
      100% { opacity: 1; transform: scale(1);}
    }
    .hello-world, .bye-world {
      position: fixed;
      top: 68vh; left: 50%;
      transform: translateX(-50%);
      font-size: 3em;
      font-weight: 800;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.8s ease;
      letter-spacing: 2px;
      text-shadow: 0 3px 15px rgba(0,0,0,0.4);
      will-change: opacity;
    }
    .hello-world { color: #222; }
    .bye-world { color: #fdfdfd; }
    .grass {
      position: fixed;
      bottom: 0; left: 0;
      width: 100vw; height: 20vh;
      background: linear-gradient(to top, #065C19, #0d8f3b);
      z-index: 4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sky"></div>
    <svg class="circle-svg" viewBox="0 0 550 300">
      <path class="circle-path" d="M 550 300 a 10 10 0 0 0 -550 0" fill="transparent"/>
      <circle fill="#FDCA48" class="sun" cx="40" cy="40" r="40"></circle>
      <circle fill="#FFEFC4" class="moon" cx="40" cy="40" r="40"></circle>
    </svg>
    <div class="stars">
      <div class="star" style="top:15%; left:10%;"></div>
      <div class="star" style="top:60%; left:20%;"></div>
      <div class="star" style="top:30%; left:70%;"></div>
      <div class="star" style="top:75%; left:85%;"></div>
      <div class="star" style="top:40%; left:50%;"></div>
    </div>
    <h1 class="hello-world">HELLO WORLD!</h1>
    <h1 class="bye-world">GOOD NIGHT!</h1>
    <div class="grass"></div>
    <div style="height:370vh;"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger, MotionPathPlugin);

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: ".container",
        start: "top top",
        end: "bottom bottom",
        scrub: 1
      }
    });

    // Sun animation
    tl.to(".sun", { opacity: 1, duration: 0.3 })
      .to(".sun", {
        motionPath: {
          path: ".circle-path",
          align: ".circle-path",
          alignOrigin: [0.5, 0.5],
          start: 0, end: 1
        },
        duration: 1
      }, "<")
      .to(".sun", { opacity: 0, duration: 0.4 });

    // Moon animation
    tl.to(".moon", { opacity: 1, duration: 0.5 })
      .to(".moon", {
        motionPath: {
          path: ".circle-path",
          align: ".circle-path",
          alignOrigin: [0.5, 0.5],
          start: 1, end: 0
        },
        duration: 1
      }, "<");

    // Sky day-to-night gradient
    tl.to(".sky", {
      background: "linear-gradient(to bottom, #0b1736, #120a27)",
      duration: 1
    }, "<");

    // Stars appear
    tl.to(".star", { opacity: 1, stagger: 0.3, duration: 0.8 }, "-=0.8");

    // Text switch
    tl.to(".hello-world", { opacity: 0.8, scale: 1.05, duration: 0.6 }, "0")
      .to(".hello-world", { opacity: 0, duration: 0.6 }, "+=1.5")
      .to(".bye-world", { opacity: 0.9, duration: 0.6 }, "-=0.5");
  </script>
</body>
</html>
