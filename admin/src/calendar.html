<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spinner Date & Time Picker</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f4f7fc;
      margin: 0;
      padding: 20px;
    }

    .picker-container {
      max-width: 400px;
      margin: auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      margin-bottom: 10px;
      border-bottom: 1px solid #eee;
    }

    .calendar-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    .spinner-control {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .spinner-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #f0f0f0;
      border: none;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .spinner-btn:hover {
      background: #e0e0e0;
    }

    .spinner-value {
      min-width: 40px;
      text-align: center;
      font-weight: bold;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      gap: 5px;
      margin-bottom: 15px;
    }

    .calendar-grid div {
      padding: 10px;
      border: 1px solid #e5e7eb;
      cursor: pointer;
      transition: 0.2s;
      border-radius: 4px;
    }

    .calendar-grid .day-name {
      background: #e0e7ff;
      font-weight: bold;
      cursor: default;
      padding: 8px;
      font-size: 14px;
    }

    .calendar-grid .day:hover {
      background: #e0f2fe;
    }

    .calendar-grid .selected {
      background: #4f46e5;
      color: white;
      font-weight: bold;
    }

    .time-spinner {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
    }

    .time-segment {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .time-label {
      font-size: 14px;
      color: #666;
    }

    .hidden {
      display: none;
    }

    .confirm-btn {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }

    .confirm-btn:hover {
      background: #4338ca;
    }

    @media (max-width: 480px) {
      .picker-container {
        padding: 15px;
      }
      
      .calendar-grid div {
        padding: 8px;
        font-size: 14px;
      }
      
      .spinner-btn {
        width: 25px;
        height: 25px;
        font-size: 14px;
      }
      
      .spinner-value {
        min-width: 30px;
      }
    }
  </style>
</head>
<body>

<div class="picker-container">
  <label for="dateInput"><strong>Select Date:</strong></label>
  <input type="text" id="dateInput" readonly placeholder="DD/MM/YYYY"/>

  <div id="calendarSection" class="hidden">
    <div class="calendar-header">
      <div class="spinner-control">
        <button class="spinner-btn" id="prevMonthBtn">←</button>
        <span class="spinner-value" id="monthDisplay"></span>
        <button class="spinner-btn" id="nextMonthBtn">→</button>
      </div>
      <div class="spinner-control">
        <button class="spinner-btn" id="prevYearBtn">←</button>
        <span class="spinner-value" id="yearDisplay"></span>
        <button class="spinner-btn" id="nextYearBtn">→</button>
      </div>
    </div>
    
    <div class="calendar-grid" id="calendarGrid"></div>
    
    <div class="time-spinner">
      <div class="time-segment">
        <span class="time-label">Hour:</span>
        <button class="spinner-btn" id="hourDownBtn">-</button>
        <span class="spinner-value" id="hourDisplay">12</span>
        <button class="spinner-btn" id="hourUpBtn">+</button>
      </div>
      
      <div class="time-segment">
        <span class="time-label">Minute:</span>
        <button class="spinner-btn" id="minuteDownBtn">-</button>
        <span class="spinner-value" id="minuteDisplay">00</span>
        <button class="spinner-btn" id="minuteUpBtn">+</button>
      </div>
    </div>
    
    <button class="confirm-btn" id="confirmBtn">Confirm Selection</button>
  </div>
</div>

<script>
  const dateInput = document.getElementById("dateInput");
  const calendarSection = document.getElementById("calendarSection");

  // Month/year controls
  const monthDisplay = document.getElementById("monthDisplay");
  const yearDisplay = document.getElementById("yearDisplay");
  const prevMonthBtn = document.getElementById("prevMonthBtn");
  const nextMonthBtn = document.getElementById("nextMonthBtn");
  const prevYearBtn = document.getElementById("prevYearBtn");
  const nextYearBtn = document.getElementById("nextYearBtn");

  // Time controls
  const hourDisplay = document.getElementById("hourDisplay");
  const minuteDisplay = document.getElementById("minuteDisplay");
  const hourUpBtn = document.getElementById("hourUpBtn");
  const hourDownBtn = document.getElementById("hourDownBtn");
  const minuteUpBtn = document.getElementById("minuteUpBtn");
  const minuteDownBtn = document.getElementById("minuteDownBtn");
  const confirmBtn = document.getElementById("confirmBtn");

  const monthNames = [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"
  ];

  let currentDate = new Date();
  let selectedDate = new Date();
  let currentHour = 12;
  let currentMinute = 0;

  function updateMonthYearDisplay() {
    monthDisplay.textContent = monthNames[currentDate.getMonth()];
    yearDisplay.textContent = currentDate.getFullYear();
  }

  function renderCalendar() {
    const calendarGrid = document.getElementById("calendarGrid");
    calendarGrid.innerHTML = "";
    
    const month = currentDate.getMonth();
    const year = currentDate.getFullYear();
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    days.forEach(day => {
      const div = document.createElement("div");
      div.className = "day-name";
      div.textContent = day;
      calendarGrid.appendChild(div);
    });

    for (let i = 0; i < firstDay; i++) {
      calendarGrid.appendChild(document.createElement("div"));
    }

    for (let date = 1; date <= lastDate; date++) {
      const cell = document.createElement("div");
      cell.className = "day";
      cell.textContent = date;

      const cellDate = new Date(year, month, date);
      
      // Highlight today
      const today = new Date();
      if (cellDate.toDateString() === today.toDateString()) {
        cell.style.border = "2px solid #4f46e5";
      }
      
      // Highlight selected date
      if (selectedDate && cellDate.toDateString() === selectedDate.toDateString()) {
        cell.classList.add("selected");
      }

      cell.addEventListener("click", () => {
        selectedDate = cellDate;
        document.querySelectorAll(".calendar-grid .day").forEach(d => d.classList.remove("selected"));
        cell.classList.add("selected");
      });

      calendarGrid.appendChild(cell);
    }
  }

  function updateTimeDisplay() {
    hourDisplay.textContent = currentHour.toString().padStart(2, "0");
    minuteDisplay.textContent = currentMinute.toString().padStart(2, "0");
  }

  function updateDateInput() {
    const d = selectedDate.getDate().toString().padStart(2, "0");
    const m = (selectedDate.getMonth() + 1).toString().padStart(2, "0");
    const y = selectedDate.getFullYear();
    const timeStr = `${currentHour.toString().padStart(2, "0")}:${currentMinute.toString().padStart(2, "0")}`;
    
    dateInput.value = `${d}/${m}/${y} ${timeStr}`;
  }

  // Event listeners
  dateInput.addEventListener("click", () => {
    calendarSection.classList.toggle("hidden");
  });

  prevMonthBtn.addEventListener("click", () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    updateMonthYearDisplay();
    renderCalendar();
  });

  nextMonthBtn.addEventListener("click", () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    updateMonthYearDisplay();
    renderCalendar();
  });

  prevYearBtn.addEventListener("click", () => {
    currentDate.setFullYear(currentDate.getFullYear() - 1);
    updateMonthYearDisplay();
    renderCalendar();
  });

  nextYearBtn.addEventListener("click", () => {
    currentDate.setFullYear(currentDate.getFullYear() + 1);
    updateMonthYearDisplay();
    renderCalendar();
  });

  hourUpBtn.addEventListener("click", () => {
    currentHour = (currentHour + 1) % 24;
    updateTimeDisplay();
  });

  hourDownBtn.addEventListener("click", () => {
    currentHour = (currentHour - 1 + 24) % 24;
    updateTimeDisplay();
  });

  minuteUpBtn.addEventListener("click", () => {
    currentMinute = (currentMinute + 5) % 60;
    updateTimeDisplay();
  });

  minuteDownBtn.addEventListener("click", () => {
    currentMinute = (currentMinute - 5 + 60) % 60;
    updateTimeDisplay();
  });

  confirmBtn.addEventListener("click", () => {
    updateDateInput();
    calendarSection.classList.add("hidden");
  });

  // Initialize
  updateMonthYearDisplay();
  updateTimeDisplay();
  renderCalendar();
</script>

</body>
</html>
