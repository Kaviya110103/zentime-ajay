spring.application.name=demo
spring.jackson.time-zone=Asia/Kolkata
server.port=${PORT:5000}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
app.embedded-ssl.enabled=${EMBEDDED_SSL_ENABLED:false}

# MySQL Database Configuration
spring.security.user.name=admin
spring.security.user.password=root
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway is run by SchemaMaintenanceService so each tenant DB is migrated only when needed.
spring.flyway.enabled=false
app.flyway.enabled=${APP_FLYWAY_ENABLED:true}

# Connection pool settings
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-swallow-size=25MB
server.tomcat.max-http-form-post-size=25MB
spring.mvc.format.date-time=iso

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:smtp.gmail.com}
spring.mail.properties.mail.smtp.ssl.protocols=${MAIL_SSL_PROTOCOLS:TLSv1.2}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.upload-dir=${UPLOAD_DIR:uploads}
app.profile-image.s3.enabled=${PROFILE_IMAGE_S3_ENABLED:false}
app.profile-image.s3.bucket=${PROFILE_IMAGE_S3_BUCKET:}
app.profile-image.s3.region=${PROFILE_IMAGE_S3_REGION:${AWS_REGION:ap-south-1}}
app.profile-image.s3.prefix=${PROFILE_IMAGE_S3_PREFIX:employees/profile}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://iie.zentime.co.in,https://iieadmin.zentime.co.in,https://iiesuperadmin.zentime.co.in,http://localhost:8081,http://127.0.0.1:8081}

spring.mvc.static-path-pattern=/uploads/**
spring.web.resources.static-locations=file:${app.upload-dir}/

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
app.logging.slow-request-threshold-ms=${SLOW_REQUEST_THRESHOLD_MS:1000}

# Tenant routing (Phase 2) - keep enabled for current production behavior.
tenant.routing.enabled=${TENANT_ROUTING_ENABLED:true}
tenant.routing.header-db=${TENANT_ROUTING_HEADER_DB:X-Tenant-Db}
tenant.routing.header-client=${TENANT_ROUTING_HEADER_CLIENT:X-Client-Id}
tenant.routing.param-client=${TENANT_ROUTING_PARAM_CLIENT:clientId}

# Push notifications (Expo)
push.enabled=${PUSH_ENABLED:true}
push.expo.url=${PUSH_EXPO_URL:https://exp.host/--/api/v2/push/send}
