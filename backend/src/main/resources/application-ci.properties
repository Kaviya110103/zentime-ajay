spring.application.name=demo-ci
server.port=${PORT:5001}

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/zentime_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false
app.flyway.enabled=false

tenant.routing.enabled=true
tenant.routing.header-db=X-Tenant-Db
tenant.routing.header-client=X-Client-Id
tenant.routing.param-client=clientId
tenant.database.prefix=tenant_

push.enabled=false
spring.mail.username=
spring.mail.password=
app.upload-dir=${java.io.tmpdir}/zentime-ci-uploads
app.profile-image.s3.enabled=false
app.cors.allowed-origin-patterns=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5001,http://127.0.0.1:5001

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO
app.logging.slow-request-threshold-ms=1000
