spring.application.name=demo-test
server.port=0

spring.datasource.url=jdbc:tc:mysql:8.0.36:///zentime_test_placeholder
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false
app.flyway.enabled=false

tenant.routing.enabled=true
tenant.routing.header-db=X-Tenant-Db
tenant.routing.header-client=X-Client-Id
tenant.routing.param-client=clientId

push.enabled=false
spring.mail.username=
spring.mail.password=
app.upload-dir=${java.io.tmpdir}/zentime-test-uploads
app.profile-image.s3.enabled=false
app.cors.allowed-origin-patterns=http://localhost:8081,http://127.0.0.1:8081
app.logging.slow-request-threshold-ms=1000
